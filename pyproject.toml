[project]
name = "projection"
version = "0.1.0"
description = "Quarterly Projections, Production Trend Analysis and lead Funnel for Total Cash Home Buyers"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.40",
    "pandas>=2.2",
    "gspread>=6.1",
    "google-auth>=2.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "plotly>=5.22",
]

[dependency-groups]
dev = ["pytest>=8.2", "ruff>=0.5"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/fixtures.py" = ["E501"]
