[server]
headless = true
runOnSave = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

# Total Cash Home Buyers brand: Victoria indigo #4D458A, Cardinal red #BD2239, Salem green #109648.
# Baloo 2 (display) + Nunito Sans (body). The frosted-glass layer is injected from ui/brand.css (ui/brand.py).
# Light and dark are both defined, so the sidebar toggle switches the whole app, tables included.
[theme]
font = "Nunito Sans:https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap, sans-serif"
headingFont = "Baloo 2:https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&display=swap, Nunito Sans, sans-serif"
codeFont = "Source Code Pro:https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;600&display=swap, monospace"
baseRadius = "10px"
buttonRadius = "999px"
showWidgetBorder = true

[theme.light]
primaryColor = "#BD2239"
backgroundColor = "#F2F1F9"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#211E33"
linkColor = "#4D458A"
borderColor = "#DDDBEA"
dataframeHeaderBackgroundColor = "#EAE9F4"
greenColor = "#109648"
redColor = "#BD2239"
violetColor = "#4D458A"
chartCategoricalColors = ["#4D458A", "#E8710A", "#1BAF7A", "#BD2239", "#2A78D6", "#EDA100"]

[theme.dark]
primaryColor = "#E0465A"
backgroundColor = "#0D0B1F"
secondaryBackgroundColor = "#1D1A36"
textColor = "#ECEAF5"
linkColor = "#C4BFF0"
borderColor = "#2E2A4A"
dataframeHeaderBackgroundColor = "#29254D"
greenColor = "#4CC27E"
redColor = "#FF7B86"
violetColor = "#A39CE3"
chartCategoricalColors = ["#8A80E0", "#D95926", "#1EAF7C", "#C9304A", "#3987E5", "#C98500"]

